{% comment %}
  DEFAULT project mark: the plain Reid Morrison shield, from
  reidmorrison.com/_includes/logo-mark.svg.

  A site with its own mark drops it at docs/_includes/logo.svg and overrides
  this one, because Jekyll searches the site's _includes before the theme's.
  Two requirements for any replacement:

    1. It must be inline SVG, not an <img>. The fills read --logo-ink and
       --logo-accent, so one file serves both themes; an externally
       referenced SVG cannot see the page's CSS.
    2. It must carry class="brand-mark" and aria-hidden="true". The height
       comes from CSS, and the adjacent project name already names the link.
{% endcomment %}
